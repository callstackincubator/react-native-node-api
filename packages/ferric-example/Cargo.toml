[package]
name = "ferric-example"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies.napi]
version = "3.14.2"
# see https://nodejs.org/api/n-api.html#node-api-version-matrix
default-features = false
features = ["napi3"]

[dependencies.napi-derive]
version = "3.6.12"
features = ["type-def"]

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
codegen-units = 1
